<!DOCTYPE html>
<html>

<head>

<title>Alif & Sabrina Wedding</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin:0;
    font-family: "Georgia", serif;
    background:#F5E6D3;
    color:#5A1A1A;
    text-align:center;
}

.container {
    padding:50px 20px;
}

h1 {
    font-size:45px;
}

.date {
    font-size:22px;
    margin-bottom:30px;
}

.card {
    background:white;
    max-width:500px;
    margin:auto;
    padding:30px;
    border-radius:20px;
}

input, textarea {

    width:90%;
    padding:10px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;

}

textarea {

    height:100px;

}

button {

    background:#800000;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:20px;
    margin-top:15px;
    cursor:pointer;

}

#wishes {

    margin-top:30px;

}

.wish-card {

    background:#fff8ef;
    padding:15px;
    margin:15px;
    border-radius:15px;

}

.gallery {

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;

}


.gallery img {

width:100%;
height:180px;
object-fit:cover;
border-radius:15px;

}

@media(max-width:600px){

.gallery {

grid-template-columns:repeat(2,1fr);

}

}
    
</style>

</head>


<body>


<div class="container">


<h1>
DR MUHAMMAD ALIF AIMAN
<br>
&
<br>
NUR SABRINA
</h1>


<div class="date">
19 September 2026
</div>



<div class="card">


<h2>Digital Guestbook</h2>


<p>
Assalamualaikum dan terima kasih kerana hadir ke majlis kami.
Sila tinggalkan ucapan dan doa buat kami.
</p>


<input 
id="name"
placeholder="Nama anda">


<textarea 
id="message"
placeholder="Tulis ucapan anda di sini...">
</textarea>


<br>


<button onclick="sendWish()">
Hantar Ucapan
</button>


<p id="status"></p>


</div>


<div id="wishes">

<h2>Ucapan Tetamu</h2>

</div>



</div>

<div class="card">

<h2>📸 Upload Moment Majlis</h2>

<p>
Kongsikan gambar kenangan anda bersama kami 🤍
</p>

<input 
type="file" 
id="photo"
accept="image/*">


<br>


<button onclick="uploadPhoto()">
Upload Gambar
</button>


<p id="photoStatus"></p>


</div>



<div class="card">

<h2>Wedding Moments</h2>

<div id="gallery" class="gallery">

</div>

</div>

<script>


const supabaseUrl = "https://myfezwspfogpwelwdzzo.supabase.co";

const supabaseKey = "sb_publishable_ldG3XaF9OtIx4gHknXpGaA_OTuPN5Th";


const client = supabase.createClient(
    supabaseUrl,
    supabaseKey
);



async function sendWish(){


const name = document.getElementById("name").value;

const message = document.getElementById("message").value;



if(name === "" || message === ""){

document.getElementById("status").innerHTML =
"Sila isi nama dan ucapan 🤍";

return;

}



const { error } = await client
.from("wishes")
.insert({

name:name,
message:message

});



if(error){

document.getElementById("status").innerHTML =
"Maaf, ucapan tidak berjaya dihantar.";

}

else{


document.getElementById("status").innerHTML =
"Terima kasih atas ucapan anda 🤍";


document.getElementById("name").value="";
document.getElementById("message").value="";


loadWishes();

const cloudName = "du42vuma";

const uploadPreset = "alif-sabrina-wedding";



async function uploadPhoto(){

alert("Upload button berfungsi");

const file =
document.getElementById("photo").files[0];

}

if(!file){

document.getElementById("photoStatus").innerHTML =
"Sila pilih gambar dahulu 🤍";

return;

}



document.getElementById("photoStatus").innerHTML =
"Sedang upload gambar...";



const formData = new FormData();

formData.append("file", file);

formData.append("upload_preset", uploadPreset);



const response = await fetch(

`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,

{

method:"POST",

body:formData

}

);



const data = await response.json();



if(data.secure_url){



await client
.from("photos")
.insert({

image_url:data.secure_url

});



document.getElementById("photoStatus").innerHTML =
"Terima kasih kerana berkongsi gambar 🤍";


document.getElementById("photo").value="";


loadPhotos();


}

else{


document.getElementById("photoStatus").innerHTML =
"Gambar gagal dimuat naik.";

}


}




async function loadPhotos(){


const {data,error}=await client
.from("photos")
.select("*")
.order("created_at",
{ascending:false});



if(data){


let output="";


data.forEach(photo=>{


output += `

<img src="${photo.image_url}">

`;



});


document.getElementById("gallery").innerHTML =
output;


}


}



loadPhotos();

}


}



async function loadWishes(){


const {data,error} = await client
.from("wishes")
.select("*")
.order("created_at",
{ascending:false});



if(data){


let output="";


data.forEach(wish=>{


output += `

<div class="wish-card">

<strong>${wish.name}</strong>

<br>

${wish.message}

</div>

`;


});


document.getElementById("wishes").innerHTML =
"<h2>Ucapan Tetamu</h2>" + output;


}


}



loadWishes();


</script>


</body>

</html>
